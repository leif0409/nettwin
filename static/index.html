<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetTwin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='16' r='5' fill='none' stroke='%230d9488' stroke-width='3'/%3E%3Ccircle cx='23' cy='16' r='5' fill='none' stroke='%230d9488' stroke-width='3'/%3E%3Cpath d='M14 16h4' stroke='%230d9488' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="9" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="23" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".55"/>
        <path d="M14 16h4" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <span>NetTwin</span>
    </div>
    <nav>
      <a href="#/map" data-nav="map"><span class="ico">&#9673;</span>Network Map</a>
      <a href="#/path" data-nav="path"><span class="ico">&#10140;</span>Path Search</a>
      <a href="#/inventory" data-nav="inventory"><span class="ico">&#9636;</span>Inventory</a>
      <a href="#/verify" data-nav="verify"><span class="ico">&#10003;</span>Verification</a>
      <a href="#/search" data-nav="search"><span class="ico">&#9906;</span>Search</a>
    </nav>
    <div class="sidebar-foot">
      Offline prototype<br>Sample configs only. No devices are contacted.
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <label class="snap">
        <span>Snapshot</span>
        <select id="snapshot"></select>
      </label>
      <a class="btn ghost small" href="#/snapshot-new" title="Create a new snapshot">+ New</a>
      <span id="snapmeta" class="muted"></span>
      <form id="globalsearch" class="gsearch">
        <input id="gq" placeholder="Search IP, device, object, rule..." autocomplete="off">
      </form>
    </header>
    <main id="view"></main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
