config system global
    set hostname "DC-FW"
end
config system interface
    edit "port1"
        set ip 172.21.1.2 255.255.255.252
        set alias "to-dc-core1"
    next
    edit "port2"
        set ip 172.21.2.2 255.255.255.252
        set alias "to-dc-core2"
    next
    edit "port3"
        set ip 10.100.10.1 255.255.255.0
        set alias "app-servers"
    next
    edit "port4"
        set ip 10.100.20.1 255.255.255.0
        set alias "db-servers"
    next
    edit "port5"
        set ip 10.100.30.1 255.255.255.0
        set alias "mgmt"
    next
end
config system zone
    edit "outside"
        set interface "port1" "port2"
    next
    edit "app"
        set interface "port3"
    next
    edit "db"
        set interface "port4"
    next
    edit "mgmt"
        set interface "port5"
    next
end
config router static
    edit 1
        set dst 10.0.0.0 255.0.0.0
        set gateway 172.21.1.1
        set device "port1"
    next
    edit 2
        set dst 10.0.0.0 255.0.0.0
        set gateway 172.21.2.1
        set device "port2"
    next
    edit 3
        set dst 0.0.0.0 0.0.0.0
        set gateway 172.21.1.1
        set device "port1"
    next
end
config firewall address
    edit "br1-lan"
        set subnet 10.11.0.0 255.255.255.0
    next
    edit "br2-lan"
        set subnet 10.12.0.0 255.255.255.0
    next
    edit "br3-lan"
        set subnet 10.13.0.0 255.255.255.0
    next
    edit "br4-lan"
        set subnet 10.14.0.0 255.255.255.0
    next
    edit "hq-users"
        set subnet 10.1.10.0 255.255.255.0
    next
    edit "hq-it"
        set subnet 10.1.20.0 255.255.255.0
    next
    edit "dba-host"
        set subnet 10.1.20.25 255.255.255.255
    next
    edit "app-servers"
        set subnet 10.100.10.0 255.255.255.0
    next
    edit "db-servers"
        set subnet 10.100.20.0 255.255.255.0
    next
    edit "mgmt-net"
        set subnet 10.100.30.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "branch-users"
        set member "br1-lan" "br2-lan" "br3-lan" "br4-lan"
    next
end
config firewall service custom
    edit "PG"
        set tcp-portrange 5432
    next
    edit "MSSQL"
        set tcp-portrange 1433
    next
    edit "MYSQL"
        set tcp-portrange 3306
    next
end
config firewall policy
    edit 10
        set name "block-mysql"
        set srcintf "any"
        set dstintf "db"
        set srcaddr "all"
        set dstaddr "db-servers"
        set action deny
        set schedule "always"
        set service "MYSQL"
    next
    edit 20
        set name "users-to-app"
        set srcintf "outside"
        set dstintf "app"
        set srcaddr "branch-users" "hq-users"
        set dstaddr "app-servers"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 30
        set name "app-to-db"
        set srcintf "app"
        set dstintf "db"
        set srcaddr "app-servers"
        set dstaddr "db-servers"
        set action accept
        set schedule "always"
        set service "PG" "MSSQL"
    next
    edit 40
        set name "dba-to-db"
        set srcintf "outside"
        set dstintf "db"
        set srcaddr "dba-host"
        set dstaddr "db-servers"
        set action accept
        set schedule "always"
        set service "PG"
    next
    edit 50
        set name "it-to-mgmt"
        set srcintf "outside"
        set dstintf "mgmt"
        set srcaddr "hq-it"
        set dstaddr "mgmt-net"
        set action accept
        set schedule "always"
        set service "SSH"
    next
    edit 60
        set name "mgmt-to-all"
        set srcintf "mgmt"
        set dstintf "outside"
        set srcaddr "mgmt-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 70
        set name "temp-vendor-access"
        set status disable
        set srcintf "outside"
        set dstintf "db"
        set srcaddr "all"
        set dstaddr "db-servers"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
