set interfaces xe-0/0/1 description "TO-DC-FW"
set interfaces xe-0/0/2 unit 0 family inet address 172.21.5.1/30
set interfaces xe-0/0/2 description "TO-INET-FW"
set routing-options static route 10.100.0.0/16 next-hop 172.21.1.2
set routing-options static route 10.200.0.0/24 next-hop 172.21.5.2
