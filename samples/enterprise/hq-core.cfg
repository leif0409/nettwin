! HQ-CORE - HQ campus core
hostname HQ-CORE
!
interface GigabitEthernet0/0
 description TO-HQ-FW
 ip address 172.22.1.2 255.255.255.252
!
interface GigabitEthernet0/1
 description BACKUP-TO-WAN-HUB
 ip address 172.20.30.2 255.255.255.252
!
interface Vlan10
 description HQ-USERS
 ip address 10.1.10.1 255.255.255.0
!
interface Vlan20
 description HQ-IT
 ip address 10.1.20.1 255.255.255.0
!
interface Vlan30
 description HQ-PRINTERS
 ip address 10.1.30.1 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 172.22.1.1
! temporary OOB route added during DC migration
ip route 10.100.30.0 255.255.255.0 172.20.30.1
!
end
