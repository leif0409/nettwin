config system global
    set hostname "BR4"
end
config system interface
    edit "wan1"
        set ip 172.20.4.1 255.255.255.252
        set alias "to-wan-hub"
    next
    edit "lan"
        set ip 10.14.0.1 255.255.255.0
        set alias "br4-users"
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 172.20.4.2
        set device "wan1"
    next
end
config firewall address
    edit "br4-lan"
        set subnet 10.14.0.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "br4-lan"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
