! WAN-HUB - hub router for branches, HQ and DC
hostname WAN-HUB
!
interface GigabitEthernet0/1
 description TO-BR1
 ip address 172.20.1.2 255.255.255.252
!
interface GigabitEthernet0/2
 description TO-BR2
 ip address 172.20.2.2 255.255.255.252
!
interface GigabitEthernet0/3
 description TO-BR3
 ip address 172.20.3.2 255.255.255.252
!
interface GigabitEthernet0/4
 description TO-BR4
 ip address 172.20.4.2 255.255.255.252
!
interface GigabitEthernet0/5
 description TO-HQ-FW
 ip address 172.20.20.1 255.255.255.252
!
interface GigabitEthernet0/6
 description HQ-BACKUP
 ip address 172.20.30.1 255.255.255.252
!
interface TenGigabitEthernet1/0
 description TO-DC-CORE1
 ip address 172.20.10.1 255.255.255.252
!
interface TenGigabitEthernet1/1
 description TO-DC-CORE2
 ip address 172.20.11.1 255.255.255.252
!
ip route 10.11.0.0 255.255.255.0 172.20.1.1
ip route 10.12.0.0 255.255.0.0 172.20.2.1
ip route 10.31.0.0 255.255.255.0 172.20.3.1
ip route 10.14.0.0 255.255.255.0 172.20.4.1
ip route 10.1.0.0 255.255.0.0 172.20.20.2
ip route 10.100.0.0 255.255.0.0 172.20.10.2
ip route 10.100.0.0 255.255.0.0 172.20.11.2
ip route 10.200.0.0 255.255.255.0 172.20.10.2
ip route 0.0.0.0 0.0.0.0 172.20.10.2
!
router bgp 65000
 neighbor 172.20.10.2 remote-as 65100
!
end
