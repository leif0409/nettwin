config system global
    set hostname "FW2"
end
config system interface
    edit "port1"
        set ip 172.16.3.2 255.255.255.252
        set alias "to-core"
    next
    edit "port2"
        set ip 10.3.30.1 255.255.255.0
        set alias "db-lan"
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 172.16.3.1
        set device "port1"
    next
end
config firewall address
    edit "app-net"
        set subnet 10.2.20.0 255.255.255.0
    next
    edit "db-net"
        set subnet 10.3.30.0 255.255.255.0
    next
    edit "users-net"
        set subnet 10.1.10.0 255.255.255.0
    next
end
config firewall service custom
    edit "PG"
        set tcp-portrange 5432
    next
end
config firewall policy
    edit 10
        set name "app-to-db"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "app-net"
        set dstaddr "db-net"
        set action accept
        set schedule "always"
        set service "PG"
    next
    edit 20
        set name "users-to-db-old"
        set status disable
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "users-net"
        set dstaddr "db-net"
        set action accept
        set schedule "always"
        set service "PG"
    next
end
