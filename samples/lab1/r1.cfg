! R1 - branch router (Cisco IOS style)
! Users LAN 10.1.10.0/24. Primary path via FW1, floating backup default via CORE.
hostname R1
!
interface GigabitEthernet0/0
 description USERS-LAN
 ip address 10.1.10.1 255.255.255.0
!
interface GigabitEthernet0/1
 description TO-FW1
 ip address 172.16.1.1 255.255.255.252
!
interface GigabitEthernet0/2
 description BACKUP-TO-CORE
 ip address 172.16.9.1 255.255.255.252
!
interface GigabitEthernet0/3
 description UNUSED
 ip address 192.0.2.1 255.255.255.0
 shutdown
!
ip route 0.0.0.0 0.0.0.0 172.16.1.2
ip route 0.0.0.0 0.0.0.0 172.16.9.2 250
ip route 198.51.100.0 255.255.255.0 192.0.2.254
!
router ospf 1
 network 10.0.0.0 0.255.255.255 area 0
!
end
