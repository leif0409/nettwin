## CORE - core router (Juniper Junos "display set" style)
## App LAN 10.2.20.0/24 is directly connected.
## Planted bug: a more-specific static for 10.1.10.128/25 points straight at R1's
## backup link, so return traffic to the upper half of the users LAN skips FW1.
## Planted bug: 10.5.50.0/24 points at FW1, whose default points back here (loop).
set system host-name CORE
set interfaces ge-0/0/0 unit 0 family inet address 172.16.2.2/30
set interfaces ge-0/0/0 description "TO-FW1"
set interfaces ge-0/0/1 unit 0 family inet address 172.16.3.1/30
set interfaces ge-0/0/1 description "TO-FW2"
set interfaces ge-0/0/2 unit 0 family inet address 10.2.20.1/24
set interfaces ge-0/0/2 description "APP-LAN"
set interfaces ge-0/0/3 unit 0 family inet address 172.16.9.2/30
set interfaces ge-0/0/3 description "BACKUP-TO-R1"
set routing-options static route 10.1.10.0/24 next-hop 172.16.2.1
set routing-options static route 10.1.10.128/25 next-hop 172.16.9.1
set routing-options static route 10.3.30.0/24 next-hop 172.16.3.2
set routing-options static route 10.5.50.0/24 next-hop 172.16.2.1
set protocols bgp group EXT type external
